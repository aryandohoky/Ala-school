<!DOCTYPE html>

    <style>
        * { font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif; scroll-behavior: smooth; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 40s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; }

        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .dept-card-active {
            border-color: #1e40af !important;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important;
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.15);
         }

        #preloader { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-out, visibility 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-x-hidden">

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="relative flex flex-col items-center">
            <div class="relative">
                <div class="absolute inset-0 bg-blue-500 rounded-full opacity-20 animate-ping"></div>
                <img src="images/logo.jpg" class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover border-4 border-blue-900 shadow-2xl relative z-10" onerror="this.src='https://ui-avatars.com/api/?name=ALA&background=1e3a8a&color=fff&size=150'">

            <div class="mt-6 flex flex-col items-center">
                <h1 class="text-3xl font-black text-blue-900 tracking-widest uppercase mb-2">ALA SCHOOL</h1>
                <div class="w-16 h-1 bg-blue-200 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-600 w-1/2 animate-[marquee_1s_linear_infinite]"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->

                    <span id="nav-school-type" class="text-[11px] text-blue-500 font-bold uppercase tracking-wider block mt-1"></span>
                </div>
            </div>
            <div class="flex bg-blue-50 p-1 rounded-full border border-blue-100" id="lang-switcher"></div>
        </div>

        <!-- News Ticker -->

            <div class="bg-blue-700 h-full px-4 text-xs font-black z-20 flex items-center gap-2 shrink-0 shadow-[5px_0_15px_rgba(0,0,0,0.3)] relative">

                  <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>

            </div>
            <div class="relative flex-1 overflow-hidden h-full flex items-center">
                <div class="animate-marquee whitespace-nowrap px-4 text-xs md:text-sm font-bold flex items-center gap-8" id="news-ticker-content"></div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->

        <div class="z-10 space-y-8 max-w-5xl reveal active">
            <div class="animate-float inline-block relative group">
                <img src="images/logo.jpg" class="w-48 h-48 md:w-64 md:h-64 relative rounded-full object-cover border-8 border-white shadow-2xl" onerror="this.src='https://ui-avatars.com/api/?name=ALA&background=1e3a8a&color=fff'">
            </div>
            <div class="space-y-4">
                <h1 id="hero-title" class="text-5xl md:text-7xl font-black text-slate-900 leading-tight"></h1>
                <p id="hero-type" class="text-xl font-bold text-blue-600 uppercase tracking-[0.25em]"></p>
            </div>
            <p id="hero-subtitle" class="text-lg md:text-2xl text-slate-500 max-w-2xl mx-auto font-medium leading-relaxed"></p>
            <button onclick="scrollToId('about')" class="bg-blue-900 text-white px-8 py-4 font-bold rounded-full hover:bg-blue-800 transition-all hover:shadow-xl hover:-translate-y-1">
                <span id="btn-discover"></span>

        </div>
    </header>

    <!-- About Section -->

                <p id="about-text" class="text-xl md:text-2xl text-slate-700 leading-loose font-medium"></p>
            </div>
        </div>
    </section>

    <!-- Goals Section -->

                <p id="goal-text" class="text-xl md:text-2xl text-blue-100 leading-relaxed"></p>

            </div>

        </div>
    </section>

    <!-- Gallery Section -->

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <!-- News Section -->

            </form>
        </div>

                location: "Duhok - Khabat District - Near Sulav Hotel", discover: "Discover More",
                footerRights: "All rights reserved to ALA SCHOOL",
                galleryItems: ['Students', 'Library', 'Activities', 'Campus', 'Labs', 'Location'],
                loginTitle: "Teachers Area", loginSubtitle: "Please enter access code", loginBtn: "Login",
                modalTitle: "Post New Update", imgLabel: "Image", imgPlaceholder: "Click to select image",
                textLabel: "Post Content", publishBtn: "Publish Now", tickerToggle: "Show in ticker bar?",
                pinConfirm: "To delete, please re-enter the access code:",
                adminName: "Admin", likeBtn: "Like", dir: 'ltr'
            }
        };

        let activeLang = 'badini';

        function scrollToId(id) { const el = document.getElementById(id); if(el) el.scrollIntoView({ behavior: 'smooth' }); }
        function setSafeText(id, text) { const el = document.getElementById(id); if(el) el.innerText = text; }

        function updateUI() {
            const t = translations[activeLang];
            document.body.dir = t.dir;

            const textIds = {
                'nav-school-name': t.schoolName, 'nav-school-type': t.schoolType, 'hero-title': t.schoolName, 'hero-type': t.schoolType,
                'hero-subtitle': t.subtitle, 'btn-discover': t.discover, 'about-title': t.aboutTitle, 'about-text': t.aboutText,
                'goal-title': t.goalTitle, 'goal-text': t.goalText, 'gallery-title': t.galleryTitle, 'news-title': t.newsTitle,
                'ticker-label': t.tickerLabel, 'empty-news-msg': t.emptyNews, 'btn-fb-text': t.facebookBtn,
                'footer-name': t.schoolName, 'footer-location': t.location, 'login-title': t.loginTitle,
                'login-subtitle': t.loginSubtitle, 'login-btn': t.loginBtn, 'modal-title': t.modalTitle,
                'img-label': t.imgLabel, 'img-placeholder': t.imgPlaceholder, 'text-label': t.textLabel,
                'publish-btn': t.publishBtn, 'ticker-toggle-label': t.tickerToggle
            };
            for (const [id, text] of Object.entries(textIds)) setSafeText(id, text);
            document.getElementById('footer-rights').innerText = t.footerRights + " © " + new Date().getFullYear();

            // RE-ADDED GOAL POINTS
            const gp = document.getElementById('goal-points');
            if(gp) gp.innerHTML = `<div class="flex items-center gap-5 bg-white/10 p-5 rounded-2xl border border-white/5 backdrop-blur-md transition-all hover:bg-white/15 hover:scale-105 duration-300"><div class="w-12 h-12 bg-blue-300 rounded-xl flex items-center justify-center text-blue-900 font-black text-xl shadow-lg"><i data-lucide="brain-circuit"></i></div><span class="text-xl font-extrabold">${t.goalPoint1}</span></div><div class="flex items-center gap-5 bg-white/10 p-5 rounded-2xl border border-white/5 backdrop-blur-md transition-all hover:bg-white/15 hover:scale-105 duration-300"><div class="w-12 h-12 bg-blue-300 rounded-xl flex items-center justify-center text-blue-900 font-black text-xl shadow-lg"><i data-lucide="laptop"></i></div><span class="text-xl font-extrabold">${t.goalPoint2}</span></div>`;

            document.getElementById('fb-link-btn').href = "https://www.facebook.com/profile.php?id=61583128689000";
            document.getElementById('footer-fb').href = "https://www.facebook.com/profile.php?id=61583128689000";
            document.getElementById('footer-ig').href = "https://www.instagram.com/qutabxana.ala.school";

            const switcher = document.getElementById('lang-switcher');
            if(switcher) {
                switcher.innerHTML = '';
                Object.keys(translations).forEach(lang => {
                    const btn = document.createElement('button');
                    const isActive = activeLang === lang;
                    btn.className = `px-4 py-1.5 rounded-full text-[11px] font-bold transition-all duration-300 ${isActive ? 'bg-blue-600 text-white shadow-md transform scale-105' : 'text-slate-500 hover:text-blue-600 hover:bg-blue-50'}`;
                    btn.innerText = lang === 'badini' ? 'بادينى' : lang === 'sorani' ? 'سۆرانی' : lang === 'arabic' ? 'عربي' : 'English';
                    btn.onclick = () => { activeLang = lang; updateUI(); };
                    switcher.appendChild(btn);
                });
            }
            renderGallery(); loadPosts(); lucide.createIcons();
        }

        function renderGallery() {
            const t = translations[activeLang];
            const galleryGrid = document.getElementById('gallery-grid');
            if(!galleryGrid) return;
            const icons = ['users', 'book-open', 'star', 'school', 'flask-conical', 'map-pin'];
            const sectionImages = ['students.jpg', 'library.jpg', 'activities.jpg', 'campus.jpg', 'lab.jpg', 'location.jpg'];
            galleryGrid.innerHTML = t.galleryItems.map((item, i) => `<button onclick="changeDepartmentImage('${sectionImages[i]}', '${item}', this)" class="card-hover group bg-white rounded-[1.5rem] p-5 border-2 border-transparent text-center flex flex-col items-center gap-3 hover:border-blue-100 relative overflow-hidden"><div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center group-hover:bg-blue-600 transition-all duration-300 shadow-sm relative z-10"><i data-lucide="${icons[i]}" class="w-7 h-7 text-blue-900 group-hover:text-white transition-colors"></i></div><h3 class="text-base font-black text-slate-700 group-hover:text-blue-900 relative z-10">${item}</h3></button>`).join('');
            const firstButton = galleryGrid.querySelector('button');
            if(firstButton && !document.querySelector('.dept-card-active')) changeDepartmentImage(sectionImages[0], t.galleryItems[0], firstButton);
        }

        function changeDepartmentImage(src, title, element) {
            const img = document.getElementById('main-gallery-image');
            const caption = document.getElementById('image-caption');
            if(!img || !caption) return;
            document.querySelectorAll('#gallery-grid button').forEach(btn => btn.classList.remove('dept-card-active'));
            if(element) element.classList.add('dept-card-active');
            img.style.opacity = '0';
            setTimeout(() => { img.src = src; caption.innerText = title; img.style.opacity = '1'; }, 400);
        }

        function checkLogin() {
            const pin = document.getElementById('access-code').value;
            if (pin === "ala") {
                isAuthorized = true; // Teacher is logged in
                document.getElementById('admin-indicator').classList.remove('hidden'); // Show Admin Indicator
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('post-modal').classList.remove('hidden');
                loadPosts(); // Refresh posts to show delete buttons
            } else { alert("رمز خطأ / کۆد خەلەتە"); }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('access-code').focus(); }
        function closeModals() { document.getElementById('login-modal').classList.add('hidden'); document.getElementById('post-modal').classList.add('hidden'); }
        function previewImage(input) { const preview = document.getElementById('image-preview'); if (input.files[0]) { const reader = new FileReader(); reader.onload = e => { preview.src = e.target.result; preview.classList.remove('hidden'); }; reader.readAsDataURL(input.files[0]); } }

        document.getElementById('post-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const text = document.getElementById('post-text').value;
            const inTicker = document.getElementById('show-in-ticker').checked;
            const fileInput = document.getElementById('post-image');
            const file = fileInput.files[0];

            if(!text && !file) {
                alert(activeLang === 'arabic' ? "يرجى كتابة نص أو اختيار صورة" : "تکایە تشتەکێ بنڤیسە یان وێنەکی هەلبژێرە");
                return;
            }

            const saveAction = (imageData) => {
                const posts = JSON.parse(localStorage.getItem('ala_v5_secure') || '[]');
                posts.unshift({
                    id: Date.now(),
                    text: text,
                    image: imageData,
                    showInTicker: inTicker,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('ala_v5_secure', JSON.stringify(posts));

                // Reset form
                document.getElementById('post-form').reset();
                document.getElementById('image-preview').classList.add('hidden');
                closeModals();
                loadPosts();
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = e => saveAction(e.target.result);
                reader.readAsDataURL(file);
            } else {
                saveAction(null);
            }
        });

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem('ala_v5_secure') || '[]');
            const container = document.getElementById('news-feed-container');
            const ticker = document.getElementById('news-ticker-content');
            const empty = document.getElementById('empty-news-state');
            if(!container || !ticker || !empty) return;

            const tickerItems = posts.filter(p => p.showInTicker && p.text);
            const logoSep = `<span class="mx-8"><img src="images/logo.jpg" class="w-6 h-6 rounded-full inline align-middle border border-white/50"></span>`;
            ticker.innerHTML = tickerItems.length === 0 ? "WELCOME TO ALA SCHOOL" : tickerItems.map(p => `<span>${p.text}</span>`).join(logoSep);

            if (posts.length === 0) { empty.classList.remove('hidden'); container.innerHTML = ''; }
            else {
                empty.classList.add('hidden');
                container.innerHTML = posts.map(p => `
                    <div class="news-card bg-white rounded-[2rem] shadow-lg border border-blue-50 overflow-hidden group reveal active">
                        <div class="p-6 flex items-center gap-4 border-b border-blue-50 bg-blue-50/20">
                            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white"><i data-lucide="school" class="w-6 h-6"></i></div>
                            <div>
                                <h3 class="font-black text-blue-900 text-base">${translations[activeLang].adminName}</h3>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${p.date} ${p.showInTicker ? '• TICKER' : ''}</p>
                            </div>
                            <!-- FIXED: Delete button only visible IF authorized -->
                            ${isAuthorized ? `
                                <button onclick="deletePost(${p.id})" class="mr-auto p-2 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition-all shadow-sm">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            ` : ''}
                        </div>
                        ${p.text ? `<div class="px-8 py-6 text-base md:text-lg text-slate-700 leading-relaxed font-medium dir="auto">${p.text}</div>` : ''}
                        ${p.image ? `<div class="px-4 pb-4"><img src="${p.image}" class="w-full h-72 md:h-96 object-cover rounded-[2rem] shadow-md"></div>` : ''}
                        <div class="px-8 py-5 bg-slate-50/50 flex gap-4"><button class="flex items-center gap-2 text-slate-400 hover:text-red-500 transition-colors font-bold text-sm"><i data-lucide="heart" class="w-5 h-5"></i> ${translations[activeLang].likeBtn}</button></div>
                    </div>`).join('');
            }
            lucide.createIcons();
            initReveal();
        }

        // SECURE DELETE LOGIC
        window.deletePost = id => {
            const pinConfirm = prompt(translations[activeLang].pinConfirm);
            if(pinConfirm === "ala") {
                let p = JSON.parse(localStorage.getItem('ala_v5_secure') || '[]');
                p = p.filter(x => x.id !== id);
                localStorage.setItem('ala_v5_secure', JSON.stringify(p));
                loadPosts();
            } else if (pinConfirm !== null) {
                alert("رمز خطأ / کۆد خەلەتە");
            }
        };

        function initReveal() {
            const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('active'); } }); }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        window.onload = () => {
            updateUI();
            setTimeout(() => { document.getElementById('preloader').style.opacity = '0'; document.getElementById('preloader').style.visibility = 'hidden'; }, 2200);
        };
    </script>
</body>
</html>
