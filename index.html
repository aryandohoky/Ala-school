    <!-- فۆنتێن نایاب یێن گۆگلی بۆ زمانێ كوردی و عەرەبی -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100;300;400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- ئایكۆنێن Lucide بۆ ناڤ لاپەری -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ڕێكخستنا فۆنتێ گشتی و تەناكرنا لڤینان */
        * { font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif; scroll-behavior: smooth; }
        /* ئەنیمێشن بۆ لڤینا لۆگۆی */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        /* ئەنیمێشن بۆ شریتێ دەنگوباسان */
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 35s linear infinite; }
        /* كلاس بۆ دیاربوونا پشكان دەمێ بەرەڤ خوار دچی */
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        /* دیزاینێ بارێ سەرێ یێ زەلال */
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); box-shadow: 0 4px 30px rgba(0,0,0,0.05); }
        /* ڕەنگێ دوكما چالاك د پشكێن قوتابخانێ دا */
        .dept-card-active { border-color: #1e40af !important; background: #eff6ff !important; transform: scale(1.05); box-shadow: 0 10px 25px rgba(30,58,138,0.1); }
        /* ڕێكخستنا قەبارێ وێنێن ستێرێن ئالا */
        .star-box { aspect-ratio: 3/4; width: 100%; border-radius: 2.5rem; overflow: hidden; position: relative; border: 4px solid #fef3c7; background: #f1f5f9; }
        .star-box img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: 0.5s; }
        .btn-loading { opacity: 0.7; pointer-events: none; }
    </style>

    <!-- دەسپێكا گرێدانا مالپەری ب سحابا فایەربەیس (Firebase) ڤە -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // پێزانیێن پرۆژێ تە (ala-school-duhok)
        const firebaseConfig = {
            apiKey: "AIzaSyBL43bVVCvIT8NfaA-KqjybZ5PsfPBhNPs",
            authDomain: "ala-school-duhok.firebaseapp.com",
            databaseURL: "https://ala-school-duhok-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ala-school-duhok",
            storageBucket: "ala-school-duhok.firebasestorage.app",
            messagingSenderId: "856763260204",
            appId: "1:856763260204:web:928f92bde0ce7db19d6089",
            measurementId: "G-FR4Q2TJBNX"
        };

        // دەسپێكرنا خزمەتگوزاریێن سحابێ
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "ala-school-duhok"; 

        // وەرگرتنا گۆهرینان ژ سحابێ ب شێوەیەکێ ئێکسەر
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.firebaseUser = user;
                // ئینانا وێنە و دەقێن مالپەری
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'site_assets'), (snap) => {
                    const data = {};
                    snap.forEach(d => data[d.id] = d.data());
                    window.cloudData = data;
                    if (window.applyCloudContent) window.applyCloudContent();
                });
                // ئینانا دەنگوباسان
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'news'), (snap) => {
                    const posts = [];
                    snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
                    window.cloudNews = posts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    if (window.loadPosts) window.loadPosts();
                });
            }
        });

        // چوونە ژوورا بێ ناڤ بۆ سحابێ
        signInAnonymously(auth);

        // دالەیا هەلگرتنا تشتان د سحابێ دا
        window.saveToFirebase = async (col, data, id = null) => {
            if(id) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', col), data);
        };
        
        // دالەیا ژێبرنێ ژ سحابێ (Delete Post)
        window.deleteFromFirebase = async (id) => {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'news', id));
        };

        // دالەیا زێدەکرنا لایکێ (Like logic)
        window.updateLikeInFirebase = async (id, newLikes) => {
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'news', id);
            await updateDoc(postRef, { likes: newLikes });
        };
    </script>
</head>

                'submit-btn': t.publishBtn, 'ticker-toggle-label': t.tickerToggle, 'admin-mode-label': t.adminModeLabel

            for (const [id, val] of Object.entries(textIds)) {
                const el = document.getElementById(id);
                if(el) el.innerText = val;

            if(selectEl) {
                const cur = selectEl.value;

                selectEl.value = cur || 'news';
            }
            document.getElementById('footer-rights').innerText = t.footerRights + " © " + new Date().getFullYear();
            
            const sw = document.getElementById('lang-switcher');
            if(sw) {
                sw.innerHTML = '';
                Object.keys(translations).forEach(l => {
                    const btn = document.createElement('button');
                    const isA = activeLang === l;
                    btn.className = `px-4 py-1.5 rounded-full text-[11px] font-black transition-all ${isA ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:text-blue-600'}`;
                    btn.innerText = translations[l].langLabel;
                    btn.onclick = () => { activeLang = l; window.updateUI(); };
                    sw.appendChild(btn);
                });

            window.applyCloudContent();
            window.loadPosts();
            lucide.createIcons();
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));

        // دروستكرنا بەشێن قوتابخانێ (دیزاینێ تە)
        function renderGallery(data) {
            const t = translations[activeLang];

            const icons = ['users', 'book-open', 'star', 'school', 'flask-conical', 'building'];
            const secKeys = ['gallery_0', 'gallery_1', 'gallery_2', 'gallery_3', 'gallery_4', 'gallery_5'];
            g.innerHTML = t.galleryItems.map((item, i) => {
                return `<button onclick="changeDepartmentImage(${i}, this)" class="group bg-white rounded-[1.5rem] p-5 border-2 border-transparent text-center flex flex-col items-center gap-3 hover:border-blue-100 transition-all shadow-sm overflow-hidden"><div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center group-hover:bg-blue-600 transition-all duration-300"><i data-lucide="${icons[i]}" class="w-7 h-7 text-blue-900 group-hover:text-white"></i></div><h3 class="text-base font-black text-slate-700 group-hover:text-blue-900">${item}</h3></button>`;
            }).join('');
            const first = g.querySelector('button');
            if(first && !document.querySelector('.dept-card-active')) changeDepartmentImage(0, first);
            lucide.createIcons();
        }

        // گۆهرینا وێنێ بەشان

            const secKeys = ['gallery_0', 'gallery_1', 'gallery_2', 'gallery_3', 'gallery_4', 'gallery_5'];
            const key = secKeys[index];
            const data = window.cloudData || {};
            const src = (data[key] && data[key].url) || window.DEFAULT_IMAGES[key];
            const title = translations[activeLang].galleryItems[index];
            const img = document.getElementById('main-gallery-image');
            const cap = document.getElementById('image-caption');
            if(!img || !cap) return;
            document.querySelectorAll('#gallery-grid button').forEach(btn => btn.classList.remove('dept-card-active'));
            if(element) element.classList.add('dept-card-active');
            img.style.opacity = '0';
            setTimeout(() => { img.src = src; cap.innerText = title; img.style.opacity = '1'; }, 300);
        };

        window.handleLike = async (id, currentLikes) => {
            if (localStorage.getItem('liked_' + id)) return;

                const newLikes = (currentLikes || 0) + 1;
                await window.updateLikeInFirebase(id, newLikes);
                localStorage.setItem('liked_' + id, 'true');
            } catch (err) { console.error(err); }

            const empty = document.getElementById('empty-news-state');

            if (posts.length === 0) { empty.classList.remove('hidden'); container.innerHTML = ''; }
            else {
                empty.classList.add('hidden');
                container.innerHTML = posts.map(p => {
                    const isLiked = localStorage.getItem('liked_' + p.id);

                        <div class="px-8 py-5 bg-slate-50/50 flex gap-4">

                                <i data-lucide="thumbs-up" class="w-5 h-5 ${isLiked ? 'fill-current' : ''}"></i> 
                                ${translations[activeLang].likeBtn} (${p.likes || 0})

                        </div>
                    </div>`;
                }).join('');

            lucide.createIcons();

        // گۆهرینا خانێن كارگێریێ ل دیڤ جۆرێ كاری
        window.toggleFormFields = () => {
            const t = document.getElementById('action-type').value;
            const imgGrp = document.getElementById('image-input-group');
            const textGrp = document.getElementById('text-input-area');
            const tickGrp = document.getElementById('ticker-toggle-area');
            const msgGrp = document.getElementById('message-edit-group');
            imgGrp.classList.add('hidden'); textGrp.classList.add('hidden'); tickGrp.classList.add('hidden'); msgGrp.classList.add('hidden');
            if (t === 'news') { imgGrp.classList.remove('hidden'); textGrp.classList.remove('hidden'); tickGrp.classList.remove('hidden'); }
            else if (t === 'message') { 
                msgGrp.classList.remove('hidden'); 
                document.getElementById('edit-goal-title').value = document.getElementById('goal-title').innerText;
                document.getElementById('edit-goal-text').value = document.getElementById('goal-text').innerText;
                document.getElementById('edit-goal-p1').value = document.getElementById('goal-point-1').innerText;
                document.getElementById('edit-goal-p2').value = document.getElementById('goal-point-2').innerText;
            }
            else { imgGrp.classList.remove('hidden'); }
        };

        // كۆمپرێس كرنا وێنەی
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        // بەلاڤكرنا تشتان
        document.getElementById('post-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const t = document.getElementById('action-type').value;
            const oldT = btn.innerText;
            btn.innerText = translations[activeLang].loadingText;
            btn.classList.add('btn-loading');
            try {
                if (t === 'message') {
                    await window.saveToFirebase('site_assets', {
                        title: document.getElementById('edit-goal-title').value,
                        text: document.getElementById('edit-goal-text').value,
                        p1: document.getElementById('edit-goal-p1').value,
                        p2: document.getElementById('edit-goal-p2').value
                    }, 'message_section');
                } else if (t === 'news') {
                    const file = document.getElementById('post-image').files[0];
                    let b64 = file ? await compressImage(file) : null;
                    await window.saveToFirebase('news', {
                        text: document.getElementById('post-text').value,
                        image: b64, showInTicker: document.getElementById('show-in-ticker').checked,
                        likes: 0,
                        date: new Date().toLocaleDateString(), timestamp: Date.now()
                    });
                } else {
                    const file = document.getElementById('post-image').files[0];
                    if(!file) throw new Error("Select image");
                    let b64 = await compressImage(file);
                    await window.saveToFirebase('site_assets', { url: b64 }, t);
                }
                alert(activeLang === 'arabic' ? "تم بنجاح" : "ب سەرکەڤتیانە هاتە ئەنجامدان");
                window.closeModals(); this.reset();
            } catch (err) { alert("Error"); } finally { btn.innerText = oldT; btn.classList.remove('btn-loading'); }
        });

        // چوونا خوارێ بۆ پشكان
        window.scrollToId = (id) => { const el = document.getElementById(id); if(el) el.scrollIntoView({ behavior: 'smooth' }); };
        
        window.onload = () => {
            window.updateUI();
        };
    </script>
</body>
</html>
